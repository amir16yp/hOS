# HOSWM session configuration.
#
# Written once, with the built-in defaults, when ~/.hoswm/config.ini is
# missing. Edit it and restart the session to apply changes. Lines starting
# with # or ; are comments. Anything HOSWM cannot understand is reported as a
# notification and ignored; the rest of the file still applies.
#
# Relative paths are resolved against this directory (~/.hoswm).
# Colors are 0xAARRGGBB or #RRGGBB.

[session]
accent = 0xff72dbac
# The desktop background. Point it at a QOI image to use one: it is
# scaled to cover the screen, keeping its proportions, and the plain
# background colour is used while no such file exists.
wallpaper = wallpaper.qoi

# The menu bar is drawn across the top of the screen and shows the menus of
# the focused window, plus a UTC clock on the right.
[menubar]
enabled = true
clock = true

# Notifications. "corner" is top-left, top-right, bottom-left or bottom-right.
# "duration_ms" is used when a caller asks for the default duration, and
# "database" is the binary log every finished notification is appended to;
# hos-notifications reads it.
[toasts]
corner = top-right
duration_ms = 4000
max_visible = 4
database = toastdb

# Screenshots are written here as QOI images, named by capture time.
[screenshots]
directory = screenshots

# Dock buttons, left to right: label | command | symbol | color | icon
# Only the label and command are required. The command is an executable, or
# @exit to leave the session. The symbol is up to two characters, drawn when
# no icon is given. The icon is a QOI image, scaled to the dock button.
[dock]
item = Terminal | /bin/hos-terminal | >_ | 0xff72dbac
item = Files | /bin/hos-files | Fs | 0xff9ccfd8
item = About hOS | /bin/hos-about | i | 0xff80afff
item = Notifications | /bin/hos-notifications | ! | 0xffe4c878
item = Settings | /bin/hos-settings | St | 0xff9ccfd8
item = Notepad | /bin/hos-notepad | Np | 0xff72dbac
item = Snake | /bin/hos-snake | Sn | 0xffef6976
item = Install hOS | /bin/hos-installer | HD | 0xff72dbac
item = Exit | @exit | X | 0xffef6976

# Shortcuts: action = [ctrl+][alt+][shift+]key, or "none" to unbind.
# Key names are single characters, f1-f12, escape, tab, enter, space,
# backspace, delete, insert, home, end, pageup, pagedown, arrow keys, print,
# or code:N for an evdev code. Shift+switch_window always cycles backwards,
# and editing shortcuts also accept Shift so they reach the terminal.
[shortcuts]
exit = ctrl+alt+escape
switch_window = alt+tab
dismiss = escape
copy = ctrl+c
cut = ctrl+x
paste = ctrl+v
select_all = ctrl+a
screenshot = print
screenshot_window = alt+print
