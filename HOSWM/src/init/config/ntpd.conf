# hos-ntpd: time synchronization. The service sleeps while offline and wakes
# when hos-netd reports that the network is up.

[ntp]
# Servers are tried in order until one answers.
servers = pool.ntp.org time.cloudflare.com

# Errors of at least this many seconds step the clock; smaller ones are
# slewed so time never runs backwards.
step = 0.5

# Seconds between queries. The interval doubles from min-poll up to max-poll
# while the clock stays accurate.
min-poll = 64
max-poll = 1024
