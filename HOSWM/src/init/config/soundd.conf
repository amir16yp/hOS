# hos-soundd: default device, volume, mute and the mixer applications play
# through. The Sound page of hos-settings edits this file.

[sound]
# Default card, by index or by its ALSA id. Left out, the first card with a
# playback device is used.
# card = 0

# Volume in percent, applied at startup when nothing was saved yet.
volume = 60

# The rate applications are mixed at, and the rate written into
# /etc/asound.conf for programs that use alsa-lib.
rate = 48000
