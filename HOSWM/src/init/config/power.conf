# hos-power: battery, power button, suspend and shutdown.
#
# Written once with these defaults. The Power page of hos-settings edits this
# file and reloads the service.

[power]
# What the power button does: shutdown, suspend, ask or ignore.
# "ask" publishes an event and lets the desktop decide.
button = shutdown

# What closing the lid does: suspend, shutdown or ignore.
lid = suspend

# Battery percentages. "low" raises a warning event; at "critical" the
# service performs critical-action (shutdown, suspend or ignore).
low = 15
critical = 5
critical-action = shutdown

# May a session that is not running as root suspend or shut the system down?
allow-users = yes
