# hos-netd: links, DHCP, DNS and Wi-Fi.
#
# Written once with these defaults. Change it here, or from the Network page
# of hos-settings, which edits this file and reloads the service.

[network]
# May a desktop user join Wi-Fi networks and renew leases? Reading the
# network state is always allowed.
allow-users = yes

# One section per interface. method is dhcp, static or off; interfaces that
# are not named here use dhcp. Loopback is configured by the service itself.
#
# [interface eth0]
# method = static
# address = 192.168.1.5/24
# gateway = 192.168.1.1
# dns = 192.168.1.1 1.1.1.1
