set timeout=3
set default=0
# The largest-resolution entries try these modes in order and take the first
# the firmware offers, which is the biggest display mode available in practice.
# GRUB has no "pick the maximum" keyword, so the list names the modes.
set hos_largest="3840x2160x32,2560x1600x32,2560x1440x32,1920x1200x32,1920x1080x32,1680x1050x32,1600x1200x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1280x720x32,1152x864x32,1024x768x32,800x600x32,auto"
menuentry "hOS live / install (generic framebuffer)" {
    insmod all_video
    set gfxmode=800x600x32,1024x768x32,800x600x24,800x600x16,auto
    set gfxpayload=$gfxmode
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 nomodeset
    initrd /boot/initramfs.cpio.gz
}
menuentry "hOS live / install (native GPU framebuffer)" {
    insmod all_video
    set gfxmode=800x600x32,auto
    set gfxpayload=$gfxmode
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 video=800x600
    initrd /boot/initramfs.cpio.gz
}
menuentry "hOS live / install (largest resolution, generic framebuffer)" {
    # gfxpayload=keep hands the mode GRUB selected straight to the kernel, so
    # the framebuffer keeps it instead of falling back to 800x600. The desktop
    # is drawn at 800x600 and scaled up to fill the screen.
    insmod all_video
    set gfxmode=$hos_largest
    set gfxpayload=keep
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 nomodeset
    initrd /boot/initramfs.cpio.gz
}
menuentry "hOS live / install (largest resolution, native GPU)" {
    # The KMS driver sets the display's own preferred mode, and hos.fbdev=1
    # keeps the session on the scaling framebuffer path, which uses all of it.
    insmod all_video
    set gfxmode=$hos_largest
    set gfxpayload=keep
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 hos.fbdev=1
    initrd /boot/initramfs.cpio.gz
}
menuentry "hOS RAM installer (USB / ISO)" {
    # The initramfs contains the installer, its tools, and a copy of vmlinuz.
    # GRUB loads the complete initramfs into memory before starting Linux.
    insmod all_video
    set gfxmode=800x600x32,800x600x24,800x600x16,auto
    set gfxpayload=$gfxmode
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 nomodeset hos.ramboot=1
    initrd /boot/initramfs.cpio.gz
}
menuentry "hOS diagnostics (BIOS text console)" {
    # Keep VGA text mode for debugging without launching graphics.
    set gfxpayload=text
    linux /boot/vmlinuz console=tty0 earlyprintk=vga,keep loglevel=7 nomodeset hos.text=1
    initrd /boot/initramfs.cpio.gz
}
